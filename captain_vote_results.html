<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Vote Results — PLD Soccer 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #ce0e2d;
  --red-mid: #e8324f;
  --dark: #0e0e0e;
  --dark-2: #1a1a1a;
  --dark-3: #252525;
  --white: #ffffff;
  --border: rgba(255,255,255,0.08);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* PASSWORD GATE */
.pw-gate {
  display: none; position: fixed; inset: 0;
  background: var(--dark); z-index: 9999;
  align-items: center; justify-content: center;
}
.pw-gate.visible { display: flex; }
.pw-box { text-align: center; width: 340px; padding: 48px 40px; }
.pw-box-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px; letter-spacing: 3px;
  color: var(--white); margin-bottom: 20px;
}
.pw-input {
  width: 100%; background: #1a1a1a; border: 1px solid #333;
  color: var(--white); border-radius: 8px; padding: 12px 16px;
  font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none;
  text-align: center; letter-spacing: 3px; margin-bottom: 12px;
  transition: border-color 0.2s;
}
.pw-input:focus { border-color: var(--red); }
.pw-input.error { border-color: #e84545; animation: shake 0.3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.pw-error { font-size: 12px; color: #e84545; min-height: 18px; margin-bottom: 10px; }
.pw-submit {
  width: 100%; background: var(--red); color: var(--white);
  border: none; border-radius: 8px; padding: 12px;
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  font-weight: 700; cursor: pointer; letter-spacing: 1px;
  transition: background 0.15s;
}
.pw-submit:hover { background: var(--red-mid); }

/* HEADER */
.page-header {
  background: var(--dark); border-bottom: 4px solid var(--red);
  padding: 28px 48px; display: flex; align-items: center; gap: 20px;
}
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,0.4);
  text-decoration: none; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1); padding: 7px 14px;
  border-radius: 6px; transition: all 0.2s; flex-shrink: 0;
}
.back-link:hover { color: var(--white); background: rgba(255,255,255,0.1); }
.header-text { flex: 1; }
.header-eyebrow {
  font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--red-mid); font-weight: 600; margin-bottom: 3px;
}
.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px; letter-spacing: 4px; line-height: 1;
}
.header-title span { color: var(--red); }

/* MAIN */
.main { max-width: 760px; margin: 0 auto; padding: 40px 24px; }

.meta-bar {
  display: flex; gap: 20px; margin-bottom: 32px; flex-wrap: wrap;
  align-items: center; justify-content: space-between;
}
.vote-count { font-size: 13px; color: rgba(255,255,255,0.4); }
.vote-count strong { color: var(--white); font-size: 16px; }
.legend {
  display: flex; gap: 16px; font-size: 12px; color: rgba(255,255,255,0.4);
  align-items: center;
}
.legend-dot {
  width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px;
}
.dot-first { background: var(--red); }
.dot-second { background: rgba(255,255,255,0.25); }

.loading { text-align: center; padding: 60px; font-size: 13px; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-transform: uppercase; }

/* RESULT ROWS */
.result-row {
  background: var(--dark-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 22px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.result-row.top { border-color: var(--red); background: rgba(206,14,45,0.05); }
.result-row.second-place { border-color: rgba(255,255,255,0.2); }

.row-top {
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
}
.rank-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; color: rgba(255,255,255,0.15);
  width: 28px; text-align: center; flex-shrink: 0; line-height: 1;
}
.result-row.top .rank-num { color: var(--red); }
.result-row.second-place .rank-num { color: rgba(255,255,255,0.4); }
.result-name { font-weight: 700; font-size: 17px; flex: 1; }
.result-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 1px;
}
.result-row.top .result-score { color: var(--red); }

/* BAR */
.bar-track {
  height: 6px; background: rgba(255,255,255,0.06);
  border-radius: 3px; overflow: hidden; margin-bottom: 10px;
  display: flex; gap: 2px;
}
.bar-first {
  height: 100%; background: var(--red); border-radius: 3px;
  transition: width 0.6s ease;
}
.bar-second {
  height: 100%; background: rgba(255,255,255,0.22); border-radius: 3px;
  transition: width 0.6s ease;
}

.vote-detail {
  display: flex; gap: 16px; font-size: 12px; color: rgba(255,255,255,0.4);
}
.vote-detail span strong { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="pw-gate visible" id="pw-gate">
  <div class="pw-box">
    <div class="pw-box-title">Vote Results</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="Password"
      onkeydown="if(event.key==='Enter')submitGate()"
      oninput="document.getElementById('pw-error').textContent=''">
    <div class="pw-error" id="pw-error"></div>
    <button class="pw-submit" onclick="submitGate()">Enter</button>
  </div>
</div>

<header class="page-header">
  <a href="coaching.html" class="back-link">← Coaching Resources</a>
  <div class="header-text">
    <div class="header-eyebrow">Paul Laurence Dunbar · Men's Soccer · 2026</div>
    <div class="header-title">CAPTAIN VOTE <span>RESULTS</span></div>
  </div>
</header>

<main class="main">
  <div class="meta-bar">
    <div class="vote-count" id="voteCount">Loading…</div>
    <div class="legend">
      <span><span class="legend-dot dot-first"></span>1st choice (2 pts)</span>
      <span><span class="legend-dot dot-second"></span>2nd choice (1 pt)</span>
    </div>
  </div>
  <div class="loading" id="loadingMsg">Loading results…</div>
  <div id="resultsList"></div>
</main>

<script>
const PASS = 'dunbar1990';
const SESSION_KEY = 'staffAuth';

function submitGate() {
  const val = document.getElementById('pw-input').value;
  if (val === PASS) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('pw-gate').classList.remove('visible');
    initFirebase();
  } else {
    const inp = document.getElementById('pw-input');
    inp.classList.add('error');
    document.getElementById('pw-error').textContent = 'Incorrect password.';
    setTimeout(() => inp.classList.remove('error'), 400);
  }
}

const CANDIDATES = [
  'Darwin Doodnauth', 'Adam Fidowicz', 'Joseph Feola',
  'Landon Fair', 'Eyasu Getaneh', 'Harrison Pope', 'Tristan Roentz'
];

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSWl0deRXE3ieLMM2TQy1h6rUmzTr0-W4",
  authDomain: "pld-soccer-tryout-evaluations.firebaseapp.com",
  databaseURL: "https://pld-soccer-tryout-evaluations-default-rtdb.firebaseio.com",
  projectId: "pld-soccer-tryout-evaluations",
  storageBucket: "pld-soccer-tryout-evaluations.firebasestorage.app",
  messagingSenderId: "130088370427",
  appId: "1:130088370427:web:e4f0d1f9f6b9f8e8c1b6f1"
};

function initFirebase() {
  try { firebase.app(); } catch(e) { firebase.initializeApp(FIREBASE_CONFIG); }
  const db = firebase.database();
  const REF = db.ref('captain_questionnaire/votes');

  REF.on('value', snap => {
    document.getElementById('loadingMsg').style.display = 'none';
    const val = snap.val();
    const votes = val ? Object.values(val) : [];
    renderResults(votes);
  });
}

function renderResults(votes) {
  const totals = {};
  CANDIDATES.forEach(name => { totals[name] = { first: 0, second: 0, score: 0 }; });

  votes.forEach(v => {
    if (v.first_choice && totals[v.first_choice]) {
      totals[v.first_choice].first++;
      totals[v.first_choice].score += 2;
    }
    if (v.second_choice && totals[v.second_choice]) {
      totals[v.second_choice].second++;
      totals[v.second_choice].score += 1;
    }
  });

  const ranked = Object.entries(totals)
    .map(([name, t]) => ({ name, ...t }))
    .sort((a, b) => b.score - a.score || b.first - a.first);

  const maxScore = ranked[0]?.score || 1;

  document.getElementById('voteCount').innerHTML =
    `<strong>${votes.length}</strong> vote${votes.length !== 1 ? 's' : ''} cast`;

  const list = document.getElementById('resultsList');
  list.innerHTML = '';

  ranked.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'result-row' + (i === 0 ? ' top' : i === 1 ? ' second-place' : '');

    const firstPct = maxScore > 0 ? (r.first * 2 / maxScore) * 100 : 0;
    const secondPct = maxScore > 0 ? (r.second * 1 / maxScore) * 100 : 0;

    row.innerHTML = `
      <div class="row-top">
        <div class="rank-num">${i + 1}</div>
        <div class="result-name">${r.name}</div>
        <div class="result-score">${r.score} pts</div>
      </div>
      <div class="bar-track">
        <div class="bar-first" style="width:${firstPct}%"></div>
        <div class="bar-second" style="width:${secondPct}%"></div>
      </div>
      <div class="vote-detail">
        <span><strong>${r.first}</strong> 1st choice vote${r.first !== 1 ? 's' : ''}</span>
        <span><strong>${r.second}</strong> 2nd choice vote${r.second !== 1 ? 's' : ''}</span>
      </div>
    `;
    list.appendChild(row);
  });
}

if (sessionStorage.getItem(SESSION_KEY) === '1') {
  document.getElementById('pw-gate').classList.remove('visible');
  initFirebase();
}
</script>
</body>
</html>
