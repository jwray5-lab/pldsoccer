<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Questionnaire Responses — PLD Soccer 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red: #ce0e2d;
  --red-mid: #e8324f;
  --dark: #0e0e0e;
  --dark-2: #1a1a1a;
  --dark-3: #252525;
  --white: #ffffff;
  --border: rgba(255,255,255,0.08);
}
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--white);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* PASSWORD GATE */
.pw-gate {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--dark);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}
.pw-gate.visible { display: flex; }
.pw-box {
  text-align: center;
  width: 340px;
  padding: 48px 40px;
}
.pw-box-eyebrow {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--red-mid);
  font-weight: 600;
  margin-bottom: 6px;
}
.pw-box-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 30px;
  letter-spacing: 3px;
  color: var(--white);
  margin-bottom: 20px;
}
.pw-input {
  width: 100%;
  background: #1a1a1a;
  border: 1px solid #333;
  color: var(--white);
  border-radius: 8px;
  padding: 12px 16px;
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  outline: none;
  text-align: center;
  letter-spacing: 3px;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.pw-input:focus { border-color: var(--red); }
.pw-input.error { border-color: #e84545; animation: shake 0.3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.pw-error { font-size: 12px; color: #e84545; min-height: 18px; margin-bottom: 10px; }
.pw-submit {
  width: 100%;
  background: var(--red);
  color: var(--white);
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
}
.pw-submit:hover { background: var(--red-mid); }

/* HEADER */
.page-header {
  background: var(--dark);
  border-bottom: 4px solid var(--red);
  padding: 28px 48px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-decoration: none;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 7px 14px;
  border-radius: 6px;
  flex-shrink: 0;
  transition: all 0.2s;
}
.back-link:hover { color: var(--white); background: rgba(255,255,255,0.1); }
.header-text { flex: 1; }
.header-eyebrow {
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--red-mid);
  font-weight: 600;
  margin-bottom: 3px;
}
.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  letter-spacing: 4px;
  line-height: 1;
}
.header-title span { color: var(--red); }

/* MAIN */
.main {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 32px;
}

/* STATS BAR */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 12px;
}
.submission-count {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
}
.submission-count strong { color: var(--white); font-size: 15px; }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 80px 32px;
  display: none;
}
.empty-state.visible { display: block; }
.empty-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px;
  letter-spacing: 3px;
  color: rgba(255,255,255,0.3);
  margin-bottom: 8px;
}
.empty-sub { font-size: 14px; color: rgba(255,255,255,0.2); }

/* LOADING */
.loading {
  text-align: center;
  padding: 60px;
  font-size: 13px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* SUBMISSION CARDS */
.submission-card {
  background: var(--dark-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px;
  cursor: pointer;
  transition: background 0.15s;
  gap: 16px;
}
.card-header:hover { background: var(--dark-3); }
.card-player-info { flex: 1; }
.card-name {
  font-weight: 700;
  font-size: 17px;
  color: var(--white);
}
.card-meta {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  margin-top: 3px;
  letter-spacing: 1px;
}
.card-toggle {
  font-size: 20px;
  color: rgba(255,255,255,0.25);
  flex-shrink: 0;
  transition: transform 0.2s;
}
.submission-card.open .card-toggle { transform: rotate(180deg); }

.card-body {
  display: none;
  border-top: 1px solid var(--border);
  padding: 24px;
}
.submission-card.open .card-body { display: block; }

.qa-block {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.qa-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.qa-section-label {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--red);
  font-weight: 600;
  margin-bottom: 12px;
}
.qa-item { margin-bottom: 14px; }
.qa-item:last-child { margin-bottom: 0; }
.qa-question {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.45);
  margin-bottom: 5px;
  letter-spacing: 0.3px;
}
.qa-answer {
  font-size: 14px;
  color: var(--white);
  line-height: 1.65;
  white-space: pre-wrap;
}
.qa-answer.empty { color: rgba(255,255,255,0.2); font-style: italic; }
.qa-scale {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(206,14,45,0.1);
  border: 1px solid rgba(206,14,45,0.25);
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
}
.qa-scale span { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 400; }

@media print {
  .pw-gate, .back-link { display: none; }
  .submission-card { page-break-inside: avoid; }
  .card-body { display: block !important; }
  body { background: white; color: black; }
}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div class="pw-gate visible" id="pw-gate">
  <div class="pw-box">
    <div class="pw-box-title">Captain Responses</div>
    <input class="pw-input" type="password" id="pw-input" placeholder="Password"
      onkeydown="if(event.key==='Enter')submitGate()"
      oninput="document.getElementById('pw-error').textContent=''">
    <div class="pw-error" id="pw-error"></div>
    <button class="pw-submit" onclick="submitGate()">Enter</button>
  </div>
</div>

<header class="page-header">
  <a href="coaching.html" class="back-link">← Coaching Resources</a>
  <div class="header-text">
    <div class="header-eyebrow">Paul Laurence Dunbar · Men's Soccer · 2026</div>
    <div class="header-title">CAPTAIN <span>RESPONSES</span></div>
  </div>
</header>

<main class="main">
  <div class="stats-bar">
    <div class="submission-count" id="submissionCount">Loading…</div>
  </div>

  <div class="loading" id="loadingMsg">Loading responses…</div>
  <div class="empty-state" id="emptyState">
    <div class="empty-title">No Submissions Yet</div>
    <div class="empty-sub">Responses will appear here once players submit the questionnaire.</div>
  </div>

  <div id="responseList"></div>
</main>

<script>
const PASS = 'dunbar1990';
const SESSION_KEY = 'staffAuth';

function submitGate() {
  const val = document.getElementById('pw-input').value;
  if (val === PASS) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('pw-gate').classList.remove('visible');
    initFirebase();
  } else {
    const inp = document.getElementById('pw-input');
    inp.classList.add('error');
    document.getElementById('pw-error').textContent = 'Incorrect password.';
    setTimeout(() => inp.classList.remove('error'), 400);
  }
}

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCSWl0deRXE3ieLMM2TQy1h6rUmzTr0-W4",
  authDomain: "pld-soccer-tryout-evaluations.firebaseapp.com",
  databaseURL: "https://pld-soccer-tryout-evaluations-default-rtdb.firebaseio.com",
  projectId: "pld-soccer-tryout-evaluations",
  storageBucket: "pld-soccer-tryout-evaluations.firebasestorage.app",
  messagingSenderId: "130088370427",
  appId: "1:130088370427:web:e4f0d1f9f6b9f8e8c1b6f1"
};

const SECTIONS = [
  {
    label: 'About You',
    questions: [
      { key: 'position', q: 'Position(s) you play' },
    ]
  },
  {
    label: 'Why Captain',
    questions: [
      { key: 'why_captain',      q: 'Why do you want to be a captain?' },
      { key: 'captain_meaning',  q: 'What does being a captain mean to you?' },
      { key: 'do_differently',   q: 'What would you do differently as captain?' },
    ]
  },
  {
    label: 'Leadership',
    questions: [
      { key: 'leadership_example',  q: 'How do you typically lead — give an example.' },
      { key: 'servant_leadership',  q: 'Captain is a service role, not a status role. Do you lead by doing or by telling?' },
      { key: 'conflict',            q: 'Two teammates are in conflict. What do you do?' },
      { key: 'low_effort',          q: 'A teammate is not giving full effort. How do you handle it?' },
      { key: 'accountability',      q: 'Accountability rating (1–10)', scale: true },
    ]
  },
  {
    label: 'Adversity & Pressure',
    questions: [
      { key: 'losing_streak',       q: 'Team is on a 3-game losing streak. What do you do?' },
      { key: 'personal_failure',    q: 'Tell us about a time you struggled or failed.' },
      { key: 'coach_disagreement',  q: 'A coach makes a decision you disagree with. How do you handle it?' },
    ]
  },
  {
    label: 'Team & Culture',
    questions: [
      { key: 'team_strengths',   q: "What are the team's biggest strengths right now?" },
      { key: 'team_improvement', q: 'What does the team need to improve most?' },
      { key: 'team_culture',     q: 'What culture do you want to build or protect?' },
      { key: 'bench_players',    q: 'How do you treat players not in the starting lineup?' },
    ]
  },
  {
    label: 'Self-Awareness',
    questions: [
      { key: 'weakness',          q: 'Your biggest weakness as a potential captain?' },
      { key: 'feedback_response', q: 'How do you respond to critical feedback?' },
      { key: 'teammate_view',     q: 'How would teammates honestly describe your leadership right now?' },
    ]
  },
  {
    label: 'Final Thoughts',
    questions: [
      { key: 'anything_else', q: 'Anything else you want us to know?' },
    ]
  },
];

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function buildCard(sub, idx) {
  const card = document.createElement('div');
  card.className = 'submission-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML = `
    <div class="card-player-info">
      <div class="card-name">${sub.name || 'Unknown'}</div>
      <div class="card-meta">${sub.position || 'Position not listed'} · Submitted ${formatDate(sub.submitted_at)}</div>
    </div>
    <div class="card-toggle">▾</div>
  `;
  hdr.addEventListener('click', () => card.classList.toggle('open'));
  card.appendChild(hdr);

  // Body
  const body = document.createElement('div');
  body.className = 'card-body';

  SECTIONS.forEach(section => {
    const block = document.createElement('div');
    block.className = 'qa-block';
    block.innerHTML = `<div class="qa-section-label">${section.label}</div>`;

    section.questions.forEach(({ key, q, scale }) => {
      const val = sub[key];
      const item = document.createElement('div');
      item.className = 'qa-item';
      if (scale) {
        item.innerHTML = `
          <div class="qa-question">${q}</div>
          ${val ? `<div class="qa-scale">${val} <span>/ 10</span></div>` : '<div class="qa-answer empty">No response</div>'}
        `;
      } else {
        item.innerHTML = `
          <div class="qa-question">${q}</div>
          <div class="qa-answer ${val ? '' : 'empty'}">${val || 'No response'}</div>
        `;
      }
      block.appendChild(item);
    });

    body.appendChild(block);
  });

  card.appendChild(body);
  return card;
}

function initFirebase() {
  try { firebase.app(); } catch(e) { firebase.initializeApp(FIREBASE_CONFIG); }
  const db = firebase.database();
  const REF = db.ref('captain_questionnaire/submissions');

  REF.on('value', snap => {
    document.getElementById('loadingMsg').style.display = 'none';
    const list = document.getElementById('responseList');
    list.innerHTML = '';

    const val = snap.val();
    if (!val) {
      document.getElementById('emptyState').classList.add('visible');
      document.getElementById('submissionCount').innerHTML = '<strong>0</strong> submissions';
      return;
    }
    document.getElementById('emptyState').classList.remove('visible');

    const entries = Object.values(val).sort((a, b) =>
      new Date(b.submitted_at) - new Date(a.submitted_at)
    );

    document.getElementById('submissionCount').innerHTML =
      `<strong>${entries.length}</strong> submission${entries.length !== 1 ? 's' : ''}`;

    entries.forEach((sub, i) => list.appendChild(buildCard(sub, i)));
  });
}

// Run session check after all functions are defined
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  document.getElementById('pw-gate').classList.remove('visible');
  initFirebase();
}
</script>
</body>
</html>
